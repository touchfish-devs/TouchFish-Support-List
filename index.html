<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="TouchFish 项目旗下的所有软件" />
  <title>TouchFish 支持列表</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
  <!--
    Sober（Material 3 Expressive Web Components）
    注意：页面结构由 app.js 通过 document.createElement 构建
    Sober 的组件在构造期会写入标记属性（如 s-tab 的 item-vertical、s-page 的 dark）
    由 HTML 解析器创建时会因自定义元素规范限制升级失败
  -->
  <script src="https://cdn.jsdelivr.net/npm/sober@2.0.0-alpha.20/dist/sober.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <noscript>
    <p class="noscript">本页面需要启用 JavaScript！</p>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
